name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manager_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manager_api?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/manager_api?schema=public
      SALT: '10'
      SECRET: ci-test-secret-min-32-chars-long!!
      JWT_EXPIRES_IN: '86400'
      JWT_ISSUER: manager-api
      JWT_AUDIENCE: manager-api-clients
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prisma migrate
        run: yarn prisma migrate deploy

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Integration tests
        run: yarn test:integration

      - name: Build
        run: yarn build

      - name: E2E tests
        run: yarn test:e2e

      - name: Dependency audit (high+)
        run: yarn audit --level high
        continue-on-error: true
